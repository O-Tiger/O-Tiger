    <rect x="182" y="522" width="120" height="40" rx="20" fill="#f0f0ec"/><text x="242" y="549" text-anchor="middle">security</text>
    <rect x="314" y="522" width="90" height="40" rx="20" fill="#f0f0ec"/><text x="359" y="549" text-anchor="middle">chat</text>
